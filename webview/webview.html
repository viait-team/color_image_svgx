<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>SVGX Viewer - RGB Trace</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: #eee;
    }

    #svg-container {
      width: 100vw;
      height: 100vh;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #new-svg-container {
      width: 100vw;
      height: 100vh;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #control-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }

    .icon-button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #333;
      color: white;
      border: none;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
      transition: background 0.2s;
    }

    .icon-button:hover {
      background: #555;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>

<body>


  <div id="svg-container">
    <!-- SVG will be injected here -->
  </div>

  <div id="new-svg-container">
    <!-- new svg container -->
  </div>


  <div id="control-panel">
    <button class="icon-button" id="open-btn" title="Open SVG File">📂</button>
    <button class="icon-button" id="open-tsv-btn" title="Open TSV File">📄</button>
    <button class="icon-button" id="convert-btn" title="Convert to SVGX">🎨</button>
    <button class="icon-button" id="open-clr-btn" title="Open CLR Palette File">🌈</button>
    <button class="icon-button" id="plot-btn" title="Plot">📈</button>
    <input type="file" id="file-input" accept=".svg" />
    <input type="file" id="tsv-file-input" accept=".tsv" />
    <input type="file" id="clr-file-input" accept=".clr" />
    <button class="icon-button" id="download-btn" title="Download SVG">💾</button>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.15/paper-full.min.js"></script>
  <script src="SVGXPathPoints.js"></script>
  <script src="SVGXPathPointsX.js"></script>
  <script src="SVGXPathSegments.js"></script>
  <script src="SVGXTsvProcessor.js"></script>
  <script src="SVGXTsvVisual.js"></script>
  <script src="SVGXCompositePathRendering.js"></script>
  <script src="SVGXDataTableRendering.js"></script>
  <script src="SVGXLineChartRendering.js"></script>


  <script>
    let tsvFileContent = ''; // Variable to store TSV content
    let clrFileContent = ''; // Variable to store CLR palette content
    let correctedTsvContent = ''; // Variable to store corrected TSV content
    let currentFileName = 'download.svg'; // Variable to store the current file name

    const openBtn = document.getElementById('open-btn');
    const openTsvBtn = document.getElementById('open-tsv-btn');
    const openClrBtn = document.getElementById('open-clr-btn');
    const convertBtn = document.getElementById('convert-btn');
    const plotBtn = document.getElementById('plot-btn');
    const downloadBtn = document.getElementById('download-btn');
    const fileInput = document.getElementById('file-input');
    const tsvFileInput = document.getElementById('tsv-file-input');
    const clrFileInput = document.getElementById('clr-file-input');
    const svgContainer = document.getElementById('svg-container');
    const newSvgContainer = document.getElementById('new-svg-container');

    openBtn.addEventListener('click', () => {
      fileInput.click();
    });

    openTsvBtn.addEventListener('click', () => {
      tsvFileInput.click();
    });

    openClrBtn.addEventListener('click', () => {
      clrFileInput.click();
    });

    downloadBtn.addEventListener('click', () => {
      const svg = svgContainer.querySelector('svg');
      if (!svg) {
        console.warn('[WARN] No SVG content to download.');
        return;
      }

      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svg);
      const blob = new Blob([svgString], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = currentFileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      console.log('[LOG] SVG download initiated.');
    });

    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      svgContainer.innerHTML = ''; // Clear previous SVG

      currentFileName = file.name; // Store the file name
      const text = await file.text();
      svgContainer.innerHTML = text;
      console.log('[LOG] SVG loaded');
    });

    tsvFileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      const tsvFileName = file ? file.name : 'unknown.tsv';
      if (!file) return;
      if (!areFileNamesEqualWithoutExt(currentFileName, tsvFileName)) {
        console.warn('[WARN] The TSV file name does not match the SVG file name.');
        return;
      }

      tsvFileContent = await file.text();
      console.log('[LOG] TSV file read successfully.');
    });

    clrFileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      const clrFileName = file ? file.name : 'unknown.clr';
      if (!file) return;
      if (!areFileNamesEqualWithoutExt(currentFileName, clrFileName)) {
        console.warn('[WARN] The CLR file name does not match the SVG file name.');
        return;
      }

      clrFileContent = await file.text();
      console.log('[LOG] CLR palette file read successfully.');
    });




    function getScale(tsvFileContent, svgNode) {
      let ocrWidth = 0;
      let svgWidth = 0;

      // 1. Get the original image width from the TSV content.
      // Tesseract's first data row (level 1) contains the page dimensions.
      if (tsvFileContent) {
        const lines = tsvFileContent.split(/\r?\n/);
        for (const line of lines) {
          // Find the page-level information row
          if (line.startsWith('1\t')) {
            const columns = line.split('\t');
            // The width is the 9th column (index 8).
            if (columns.length > 8) {
              ocrWidth = parseInt(columns[8], 10);
              // We found the page dimensions, so we can stop looking.
              break;
            }
          }
        }
      }

      // 2. Get the SVG coordinate space width from the viewBox attribute.
      if (svgNode && svgNode.getAttribute('viewBox')) {
        const viewBoxParts = svgNode.getAttribute('viewBox').split(' ');
        // The viewBox format is "min-x min-y width height". Width is at index 2.
        if (viewBoxParts.length === 4) {
          svgWidth = parseFloat(viewBoxParts[2]);
        }
      } else if (svgNode) {
        // Fallback: Read width attribute if viewBox is not present
        const widthAttr = svgNode.getAttribute('width');
        if (widthAttr) {
          svgWidth = parseFloat(widthAttr);
        }
      }

      // 3. Calculate the scale factor.
      // This is the ratio of the target coordinate system (SVG) to the source (OCR).
      if (ocrWidth > 0 && svgWidth > 0) {
        return svgWidth / ocrWidth;
      }

      // As a safe fallback, return 1.0 if either dimension could not be found.
      return 1.0;
    }


    convertBtn.addEventListener('click', (event) => {

      const svg = svgContainer.querySelector('svg');
      if (!svg) {
        console.warn('[WARN] No SVG loaded');
        return;
      }
      if (!tsvFileContent) {
        console.warn('[WARN] No TSV file loaded');
        return;
      }

      const useRelaxedRule = event.ctrlKey;
      console.log(`[LOG] Convert clicked. Using relaxed float-fixing rule: ${useRelaxedRule}`);

      const scale = getScale(tsvFileContent, svg);
      console.log(`[LOG] Calculated scale factor: ${scale}`);

      // Process TSV data
      let jsonResult = null;
      if (tsvFileContent) {
        try {
          const processor = new SVGXTsvProcessor(tsvFileContent, scale);
          jsonResult = processor.GetImageText(useRelaxedRule);
          correctedTsvContent = processor.geCorrectedTsvContent();
        } catch (error) {
          console.error("Error processing TSV file:", error);
        }
      } else {
        console.warn('[WARN] No TSV content available. Please load a TSV file first.');
      }

      // all paths in svg to groups of sub paths
      const pathElements = svg.querySelectorAll('path');
      const parser = new SVGXPathPoints();

      let groupIndex = 0;
      pathElements.forEach(path => {
        // const group = parser.extractSemanticSubpaths(path);
        const group = parser.decomposeToSubpathsGroup(path, groupIndex++);
        if (group) {
          path.replaceWith(group);
        }
      });

      // Remove matched paths and insert text elements

      if (svg) {

        const visualizer = new SVGXTsvVisual(tsvFileContent, svg, scale);
        visualizer.applyColorToSvg();
        visualizer.matchPathsToWords();
        if (jsonResult) {
          visualizer.finalMatchPathsToWords(jsonResult);
        }

        const replacedParentNode = visualizer.removeMatchedPaths();
        // visualizer.removeSegmentsByMatchingWords();
        // visualizer.replaceSegmentsByMatchingWords();

        if (jsonResult) {
          console.log("--- Inserting Text Elements ---");
          visualizer.insertText(jsonResult, replacedParentNode);
        }


        const rendering = new SVGXCompositePathRendering(svg);
        rendering.combineSubPathsToCompositePath();
        // rendering.correctSubPathRendering();
        rendering.removeEmptyElementG();

      }


    });


    plotBtn.addEventListener('click', (event) => {

      const svg = svgContainer.querySelector('svg');
      if (!svg) {
        console.warn('[WARN] No SVG loaded');
        return;
      }

      // Detect chart type from lctype attribute
      const lctype = svg.getAttribute('lctype') || 'table';
      console.log(`[LOG] Chart type detected: ${lctype}`);

      if (lctype === 'line') {
        const eventCtrlKey = event.ctrlKey;
        // ===== LINE CHART RENDERING =====
        const rendering = new SVGXLineChartRendering(svg, clrFileContent);
        // Step 1: Add Logical Mapping (xlm, ylm)
        rendering.addLogicalMapping();
        // Step 2: Add Legend Info (lc_legend_id, lc_legend_instance, lc_legend_ref)
        rendering.addLegendInfo();
        // Step 3: Enable Interactivity (click legend -> flash lines)
        rendering.enableLegendInteractivity();

        // Step 4: Extract Data and Redraw
        const chartData = rendering.extractLogicalData();
        console.log('[LOG] Calling redrawChart with', chartData.length, 'series');
        rendering.redrawChart(chartData, '#new-svg-container');

        // Scroll to show the new chart
        const newContainer = document.getElementById('new-svg-container');
        if (newContainer) {
          newContainer.scrollIntoView({ behavior: 'smooth' });
        }

        if (eventCtrlKey) {
          // If Ctrl key is pressed, download the SVG immediately
          downloadTableSvg();
        }
        
        return;
      }

      // ===== TABLE/HEATMAP RENDERING (existing code) =====
      const rendering = new SVGXDataTableRendering(svg);
      const styles = rendering.getStyleFromTableSvg();

      //
      const rowTolerance = 10;
      const exportComments = true;
      const exportTitle = true;
      const exportXAxisLabel = true;
      const exportXTicks = true;
      const exportYAxisLabel = true;
      const exportYTicks = true;
      const exportTableCsv = true;

      const data = rendering.getStructuredOcrData(correctedTsvContent,
        rowTolerance,
        exportComments,
        exportTitle,
        exportXAxisLabel,
        exportXTicks,
        exportYAxisLabel,
        exportYTicks,
        exportTableCsv
      );
      const tableCsv = data.tableCsv;
      const comments = data.comments;
      const title = data.title;
      const x_label = data.x_axis_label;
      const x_ticks = data.x_ticks;
      const y_label = data.y_axis_label;
      const y_ticks = data.y_ticks;
      // const data = rendering.getCsvTableData(correctedTsvContent);
      // const tableCsv = data;

      // rendering.drawSVGChart(tableCsv, title, x_label, x_ticks, y_label, y_ticks);
      rendering.drawSVGChartWithStyles(tableCsv, title, x_label, x_ticks, y_label, y_ticks, styles, comments);

      if (event.ctrlKey) {
        // If Ctrl key is pressed, download the SVG immediately
        downloadTableSvg();
      }

      if (event.shiftKey) {
        // If Shift key is pressed, download the CSV immediately
        downloadCsv(tableCsv, 'plot_data.csv');
      }

    });

    function downloadTableSvg() {

      const svg = newSvgContainer.querySelector('svg');
      if (!svg) {
        console.warn('[WARN] No SVG content to download.');
        return;
      }

      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svg);
      const blob = new Blob([svgString], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = "New_" + currentFileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      console.log('[LOG] SVG download initiated.');

    }


    function downloadCsv(csvString, filename = "table_data.csv") {
      const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", filename);
      link.style.visibility = "hidden";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }


    function areFileNamesEqualWithoutExt(fileName1, fileName2) {
      // Handle null, undefined, or empty strings
      if (!fileName1 || !fileName2) {
        return false;
      }

      // Remove path and get just the file name
      const name1 = fileName1.split(/[/\\]/).pop();
      const name2 = fileName2.split(/[/\\]/).pop();

      // Remove extension (everything after the last dot)
      const nameWithoutExt1 = name1.includes('.') ? name1.substring(0, name1.lastIndexOf('.')) : name1;
      const nameWithoutExt2 = name2.includes('.') ? name2.substring(0, name2.lastIndexOf('.')) : name2;

      // Compare case-insensitively (you can remove .toLowerCase() for case-sensitive comparison)
      return nameWithoutExt1.toLowerCase() === nameWithoutExt2.toLowerCase();
    }

  </script>

</body>

</html>
